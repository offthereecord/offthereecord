# Crea una página fija por cada nota, banda y cobertura publicada y actualiza el sitemap.
# Corre solo una vez por día; también podés correrlo a mano desde la pestaña Actions.
name: Generar páginas para Google
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['generar-paginas.mjs', 'nota.html', 'banda.html', 'cobertura.html', 'config.js']
permissions:
  contents: write
concurrency:
  group: generar-paginas
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sanitize-html@2
      - run: node generar-paginas.mjs
      - name: Guardar los cambios
        run: |
          git config user.name "otr-bot"
          git config user.email "otr-bot@users.noreply.github.com"
          git add -A sitemap.xml
          for c in notas bandas coberturas; do git add -A "$c" 2>/dev/null || true; done
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Páginas generadas automáticamente"
            git pull --rebase origin main
            git push
          fi
